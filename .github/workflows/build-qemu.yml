name: Build QEMU for Eoan

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install pbuilder
        run: |
          sudo apt-get update
          sudo apt-get install --yes debootstrap devscripts pbuilder ubuntu-keyring

      - name: Create Eoan pbuilder base
        env:
          BASETGZ: ${{ runner.temp }}/eoan-arm64.tgz
        run: |
          sudo pbuilder create \
            --basetgz "$BASETGZ" \
            --distribution eoan \
            --architecture arm64 \
            --mirror http://old-releases.ubuntu.com/ubuntu \
            --components "main universe"

      - name: Download and build the Eoan source package
        env:
          BASETGZ: ${{ runner.temp }}/eoan-arm64.tgz
          SOURCE_DIR: ${{ runner.temp }}/qemu-source
          RESULT_DIR: ${{ runner.temp }}/qemu-packages
          RUNSCRIPT: ${{ runner.temp }}/build-in-eoan.sh
        run: |
          mkdir -p "$SOURCE_DIR" "$RESULT_DIR"
          cat > "$RUNSCRIPT" <<'EOF'
          #!/bin/bash
          set -eux

          cat > /etc/apt/sources.list <<APT
          deb http://old-releases.ubuntu.com/ubuntu eoan main universe
          deb http://old-releases.ubuntu.com/ubuntu eoan-updates main universe
          deb-src http://old-releases.ubuntu.com/ubuntu eoan main universe
          deb-src http://old-releases.ubuntu.com/ubuntu eoan-updates main universe
          APT
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install --yes dpkg-dev devscripts libsdl2-dev \
            gcc-i686-linux-gnu binutils-i686-linux-gnu
          cd "${{ runner.temp }}/qemu-source"
          apt-get source qemu
          apt-get build-dep --yes qemu
          cd "$(find . -maxdepth 1 -type d -name "qemu-*" -print -quit)"
          sed -i 's/^enable_linux_user = .*/enable_linux_user = disable/' debian/rules
          sed -i 's#${MAKE} -f ${CURDIR}/debian/optionrom.mak#${MAKE} -f ${CURDIR}/debian/optionrom.mak CC=i686-linux-gnu-gcc LD=i686-linux-gnu-ld OBJCOPY=i686-linux-gnu-objcopy#' debian/rules
          printf '\nsystem_targets = i386\n' >> debian/rules
          QEMU_CONFIGURE_OPTIONS="--target-list=i386-softmmu --disable-linux-user \
            --enable-sdl --disable-gtk --disable-opengl \
            --disable-lzo --disable-snappy --disable-bzip2 --disable-lzfse \
            --disable-xen --disable-auth-pam" \
            DH_OPTIONS="-Nqemu-system-gui" \
            DEB_BUILD_OPTIONS="parallel=$(nproc)" \
            dpkg-buildpackage -us -uc -b
          cp ../*.deb "${{ runner.temp }}/qemu-packages/"
          EOF
          chmod +x "$RUNSCRIPT"
          sudo pbuilder execute \
            --basetgz "$BASETGZ" \
            --bindmounts "$SOURCE_DIR" \
            --bindmounts "$RESULT_DIR" \
            --save-after-exec \
            -- "$RUNSCRIPT"

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: qemu-eoan-arm64
          path: ${{ runner.temp }}/qemu-packages/*.deb
          if-no-files-found: error